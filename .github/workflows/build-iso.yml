name: Build ISO

on:
  push:
    branches: [ bare-minimal-linux ]
  pull_request:
    branches: [ bare-minimal-linux ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v2
      with:
        # how man commits do we fetch? we need enough so that we have a tagged commit as well else the build will fail
        fetch-depth: '20'
    # workaround for fetching tags from https://github.com/actions/checkout/issues/290 as the action does not fetch tags, even when all commits are fetched
    - name: get git tags
      run: |
        git fetch --tags --force
    - name: git tags
      run: |
        git describe --tags --abbrev=0
        git rev-parse --short HEAD
    - run: df -h
    - name: "node-cleanup"
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a
    - run: df -h
    - name: install prerequsites
      run: |
        sudo apt install automake libtool pkg-config # lldpd
        sudo apt install wget make gawk gcc bc bison flex xorriso libelf-dev libssl-dev xz-utils cpio file build-essential g++ # minimal linux
        sudo apt install pkg-config upx upx-ucl 
    - name: 'Step 00 - Clean'
      run: |
        cd ./src
        bash ./00_clean.sh
    - name: 'Step 01 - Get Kernel'
      run: |
        cd ./src
        bash ./01_get_kernel.sh
    - name: 'Step 02 - Build Kernel'
      run: |
        cd ./src
        bash ./02_build_kernel.sh
    - name: 'Step 03 - Get GNU C Library'
      run: |
        cd ./src
        bash ./03_get_glibc.sh
    - name: 'Step 04 - Build GNU C Library'
      run: |
        cd ./src
        bash ./04_build_glibc.sh
    - name: 'Step 05 - Prepare Sysroot'
      run: |
        cd ./src
        bash ./05_prepare_sysroot.sh
    - name: 'Step 06 - Get Busybox'
      run: |
        cd ./src
        bash ./06_get_busybox.sh
    - name: 'Step 07 - Build Busybox'
      run: |
        cd ./src
        bash ./07_build_busybox.sh
    - name: 'Step 08 - Prepare Overlay Bundles'
      run: |
        cd ./src
        bash ./08_prepare_bundles.sh
    - name: 'Step 09 - Generate Root Filesystem'
      run: |
        cd ./src
        bash ./09_generate_rootfs.sh
    - name: 'Step 10 - Pack Root Filesystem'
      run: |
        cd ./src
        bash ./10_pack_rootfs.sh
    - name: 'Step 11 - Generate Overlay Area'
      run: |
        cd ./src
        bash ./11_generate_overlay.sh
    - name: 'Step 12 - Get Syslinux'
      run: |
        cd ./src
        bash ./12_get_syslinux.sh
    - name: 'Step 12 - Get Systemd-boot'
      run: |
        cd ./src
        bash ./12_get_systemd-boot.sh

    - run: df -h
    - name: 'Step 13 - Prepare ISO Image'
      run: |
        cd ./src
        sudo bash ./13_prepare_iso.sh
    - run: df -h
    - name: 'Step 14 - Generate ISO Image'
      run: |
        cd ./src
        bash ./14_generate_iso.sh

    - run: df -h
    - name: upload iso as artifact
      uses: actions/upload-artifact@v4
      with:
        name: bare-minimal-linux.iso
        path: src/minimal_linux_live.iso
    - name: 'Step 15 - Generate Docker Image'
      run: |
        cd ./src
        bash ./15_generate_image.sh
    - name: 'Step 16 - Final Cleanup'
      run: |
        cd ./src
        bash ./16_cleanup.sh
    - name: 'Test Docker'
      run: |
        cd .github
        bash ./test_docker.sh
    - name: 'Test QEMU'
      run: |
        cd .github
        bash ./test_qemu.sh

